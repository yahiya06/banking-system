spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:

        # Account service routes
        - id: account-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/account/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        # Transection service routes
        - id: transection-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/transections/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        # Payment service routes
        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10


server:
  port; 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway